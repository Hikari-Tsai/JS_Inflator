name: Build plug-ins

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (VST3, AU, AAX)
    uses: ./.github/workflows/macOS Build.yml

  windows:
    name: Windows (VST3, AAX)
    uses: ./.github/workflows/Windows Build.yml

  release:
    name: Publish plug-in pre-release
    needs: [macos, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: plugin-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download packaged plug-ins
        uses: actions/download-artifact@v4
        with:
          pattern: JS_Inflator-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Publish AAX testing pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s dist/JS_Inflator-macOS-VST3.zip
          test -s dist/JS_Inflator-macOS-AAX.zip
          test -s dist/JS_Inflator-macOS-AU.zip
          test -s dist/JS_Inflator-Windows-VST3.zip
          test -s dist/JS_Inflator-Windows-AAX.zip
          test -s dist/JS_Inflator-macOS.dmg
          test -s dist/JS_Inflator-Windows-Setup.exe
          test -s dist/JS_Inflator-Windows-Uninstall.zip
          cat > release-notes.md <<EOF
          AAX 改作測試版 / Experimental AAX adaptation.

          - macOS VST3, AUv2 and AAX universal binaries: Intel x86_64 and Apple Silicon arm64.
          - Windows VST3 and AAX: x64.
          - macOS DMG: selectable PKG installer plus Uninstall-JS-Inflator.command.
          - Windows Setup EXE: selectable installer and registered uninstaller; separate Uninstall ZIP also supports manual ZIP installations.
          - AAX is optional and unselected by default. Quit all DAWs before installing or uninstalling. Existing JS Inflator bundles at the same paths are replaced.
          - Installers are unsigned/not notarized. Install/uninstall smoke tests run on disposable CI runners; they do not establish OS-wide compatibility.
          - AAX requires Pro Tools Developer on both platforms. macOS bundles are ad-hoc signed; Windows builds are unsigned. Neither has Avid/PACE signing for standard Pro Tools.
          - Build, architecture, and bundle checks do not replace Pro Tools functional testing.
          - GPLv3: source and build instructions are available at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}. Clone this revision with recursive submodules and use the SDK revisions pinned in the workflow.
          - Test coverage: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/tests/results/aax-verification.md
          EOF
          gh release create "${RELEASE_TAG}" \
            dist/JS_Inflator-macOS-VST3.zip \
            dist/JS_Inflator-macOS-AAX.zip \
            dist/JS_Inflator-macOS-AU.zip \
            dist/JS_Inflator-Windows-VST3.zip \
            dist/JS_Inflator-Windows-AAX.zip \
            dist/JS_Inflator-macOS.dmg \
            dist/JS_Inflator-Windows-Setup.exe \
            dist/JS_Inflator-Windows-Uninstall.zip \
            --verify-tag --prerelease --latest=false \
            --title "JS Inflator ${RELEASE_TAG} — AAX testing" \
            --notes-file release-notes.md
