name: Windows Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_DIR: build-windows
  BUILD_TYPE: Release
  AAX_SDK_DIR: build-aax-ci-deps/juce/modules/juce_audio_plugin_client/AAX/SDK

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout VST3 SDK 3.7.12
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: v3.7.12_build_20
          path: vst3sdk
          submodules: recursive

      # Only Avid's SDK is used, under its GPLv3 option; no JUCE modules are linked.
      - name: Checkout public AAX SDK
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 72782788ce18c2d4d760b28e0921d6ffc6431102
          path: build-aax-ci-deps/juce
          sparse-checkout: modules/juce_audio_plugin_client/AAX/SDK
          persist-credentials: false

      - name: Verify AAX SDK version
        run: |
          if (!(Test-Path "$env:AAX_SDK_DIR/LICENSE.txt")) { throw 'Missing AAX SDK license' }
          $version = Get-Content "$env:AAX_SDK_DIR/Interfaces/AAX_Version.h" -Raw
          if ($version -notmatch '(?m)^#define AAX_SDK_CURRENT_REVISION\s+\(\s*20209000\s*\)') {
            throw 'Expected AAX SDK 2.9.0'
          }

      - name: Configure Visual Studio project
        run: |
          cmake -S . -B "$env:BUILD_DIR" -G "Visual Studio 17 2022" -A x64 `
            -DGITHUB_ACTIONS=ON -DSMTG_WIN=ON `
            -DSMTG_ENABLE_VSTGUI_SUPPORT=ON `
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF `
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF `
            -DSMTG_CREATE_BUNDLE_FOR_WINDOWS=ON `
            -DSMTG_CREATE_PLUGIN_LINK=OFF `
            "-DSMTG_AAX_SDK_PATH=$env:GITHUB_WORKSPACE/$env:AAX_SDK_DIR"

      - name: Build VST3
        run: cmake --build "$env:BUILD_DIR" --config "$env:BUILD_TYPE" --target JS_Inflator

      - name: Build AAX
        run: cmake --build "$env:BUILD_DIR" --config "$env:BUILD_TYPE" --target JS_Inflator-aax

      - name: Verify x64 bundles and package
        run: |
          $bundles = @(
            @{ Format = 'VST3'; Path = "$env:BUILD_DIR/VST3/$env:BUILD_TYPE/JS_Inflator.vst3"; Binary = 'Contents/x86_64-win/JS_Inflator.vst3' },
            @{ Format = 'AAX'; Path = "$env:BUILD_DIR/AAXPLUGIN/$env:BUILD_TYPE/JS_Inflator.aaxplugin"; Binary = 'Contents/x64/JS_Inflator.aaxplugin' }
          )
          foreach ($bundle in $bundles) {
            $binary = Join-Path $bundle.Path $bundle.Binary
            if (!(Test-Path $binary -PathType Leaf)) { throw "Missing plug-in binary: $binary" }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $binary).Path)
            if ([BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) { throw "Invalid DOS header: $binary" }
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550 -or
                [BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) {
              throw "Expected an x64 PE binary: $binary"
            }
            Compress-Archive -LiteralPath $bundle.Path -DestinationPath "$env:BUILD_DIR/JS_Inflator-Windows-$($bundle.Format).zip" -Force
          }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: JS_Inflator-Windows-VST3-${{ github.sha }}
          path: ${{ env.BUILD_DIR }}/JS_Inflator-Windows-VST3.zip
          if-no-files-found: error

      - name: Upload AAX
        uses: actions/upload-artifact@v4
        with:
          name: JS_Inflator-Windows-AAX-${{ github.sha }}
          path: ${{ env.BUILD_DIR }}/JS_Inflator-Windows-AAX.zip
          if-no-files-found: error

      - name: Build Windows installer and uninstaller
        run: ./packaging/windows/build.ps1 -BuildDir "$env:BUILD_DIR"

      - name: Verify Windows install and uninstall
        run: ./packaging/windows/verify-installer.ps1 -BuildDir "$env:BUILD_DIR"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JS_Inflator-Windows-Installer-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/JS_Inflator-Windows-Setup.exe
            ${{ env.BUILD_DIR }}/JS_Inflator-Windows-Uninstall.zip
          if-no-files-found: error
